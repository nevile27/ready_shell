name: env
themes:
  - shell
tags:
  - coreutils
summary: Lance une commande dans un environnement modifié, ou liste les variables.
explanation: >-
  env sans argument écrit l’environnement du processus. env VAR=valeur commande lance
  commande avec cette variable, sans la laisser dans le shell. env -u VAR commande la
  retire pour ce seul lancement. env sert aussi de shebang portable : #!/usr/bin/env
  bash cherche bash dans PATH.
subcommands:
  - name: liste
    summary: Écrit l’environnement du processus.
    explanation: >-
      Sans argument, `env` montre une variable par ligne, sous la forme NOM=valeur. Ce
      sont celles que les commandes lancées ensuite héritent.
    examples:
      - title: Lister
        command: env
        comment: NOM=valeur, une par ligne.
  - name: "-u"
    summary: Retire une variable pour une seule commande.
    explanation: "`env -u VAR commande` lance commande sans cette variable. Le shell, lui, la garde."
    examples:
      - title: Sans proxy
        command: env -u http_proxy curl https://example.com
        comment: curl ne voit pas http_proxy. Le shell le garde.
  - name: "-i"
    summary: Démarre avec un environnement vide.
    explanation: >-
      `env -i commande` ne transmet rien, sauf ce que l’on redonne ensuite sous la forme
      NOM=valeur.
    examples:
      - title: Environnement minimal
        command: env -i PATH=/usr/bin ls
        comment: ls ne voit que PATH, pas le reste de la session.
see_also:
  - export
  - bash
examples:
  - title: Lister l’environnement
    command: env
    comment: Une variable par ligne, sous la forme NOM=valeur.
  - title: Lancement ponctuel
    command: env LANG=C.UTF-8 date
    comment: date voit cette locale ; le shell garde la sienne ensuite.
status: courante
package:
  debian: coreutils
  redhat: coreutils
  suse: coreutils
  arch: coreutils
  alpine: busybox
overrides:
  alpine:
    note: >-
      Applet BusyBox. Le paquet coreutils fournit la version GNU, qui accepte -0 et -u
      de la même façon.
