<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalogue des commandes Linux</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231c2420' width='32' height='32' rx='4'/%3E%3Cpath d='M8 10h10M8 16h16M8 22h7' stroke='%23e7f2eb' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <p class="eyebrow">Hors ligne · novembre 2026</p>
          <h1>Catalogue des commandes Linux</h1>
        </div>
        <form class="search" role="search">
          <label class="sr" for="q">Rechercher une commande, un mot ou un exemple</label>
          <input id="q" name="q" type="search" placeholder="Rechercher : ip addr, systemctl status…" autocomplete="off" />
        </form>
        <div class="filters">
          <label><span id="family-label">Famille</span> <select id="family"></select></label>
          <label><span id="status-label">Statut</span> <select id="status"></select></label>
          <label><span id="lang-label">Langue</span> <select id="lang"></select></label>
        </div>
      </header>
      <nav id="themes" aria-label="Thèmes"></nav>
      <section id="list" aria-label="Commandes"></section>
      <article id="detail" aria-live="polite"></article>
    </div>
    <noscript>Ce catalogue a besoin de JavaScript, entièrement local, pour la recherche et les filtres.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
